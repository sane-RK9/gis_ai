services:
  redis:
    image: redis:8.0
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./src:/app/src # For live-reloading code changes
      - geodata:/data_workspace

  gvisor-worker:
    build:
      context: .
      dockerfile: Dockerfile.gvisor
    # runtime: runsc # Uncomment this line to use gVisor
    entrypoint: ["sleep", "infinity"]
    volumes:
      - geodata:/data_workspace

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile # It can reuse the same Dockerfile as the API
    command: python -m src.orchestration.runner
    environment:
      - REDIS_URL=redis://redis:6379/0 
      # This tells the container where to find Ollama on the host machine
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      - redis
    volumes:
      - ./src:/app/src # For live-reloading code changes
      - ./resources:/app/resources
      - geodata:/data_workspace

volumes:
  redis-data:
  geodata: