services:
  redis:
    image: redis:8.0
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - ./src:/app/src
      - geodata:/data_workspace

  gvisor-worker:
    build:
      context: .
      dockerfile: Dockerfile.gvisor
    # runtime: runsc # Commented out for Docker Desktop
    entrypoint: ["sleep", "infinity"]
    volumes:
      - geodata:/data_workspace

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m src.orchestration.runner
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - GVISOR_WORKER_CONTAINER_NAME=backend-gvisor-worker-1
    depends_on:
      - redis
      - gvisor-worker
    volumes:
      # Mount the Docker socket from the host into the container
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the source code for live-reloading
      - ./src:/app/src
      - ./resources:/app/resources
      - geodata:/data_workspace

volumes:
  redis-data:
  geodata: