
services:
  redis:
    image: "redis:alpine"
    container_name: geospatial-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    container_name: geospatial-backend
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Mount the src directory for live reloading during development
      - ./src:/app/src
    env_file:
      - .env
    depends_on:
      - redis

volumes:
  redis_data: