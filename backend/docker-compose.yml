services:
  redis:
    image: redis:8.0
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    volumes:
      - .:/app
      - geodata:/data_workspace

  gvisor-worker:
    build:
      context: .
      dockerfile: Dockerfile.gvisor
    runtime: runsc
    entrypoint: ["sleep", "infinity"]
    volumes:
      - geodata:/data_workspace

  orchestrator:
    build:
      context: .
    command: python src/orchestration/runner.py
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    volumes:
      - .:/app
      - geodata:/data_workspace

volumes:
  redis-data:
  geodata: